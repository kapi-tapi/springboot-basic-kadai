<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>お問い合わせフォーム</title>
</head>
<body>
	<h2>お問い合わせフォーム</h2>
	<form th:action="@{/confirm}" method="post" th:object="${contactForm}" >
			<table>
				<tr>
					<td><label for="name">お名前</label></td>
					<td><input type="text" th:field="*{name}">
					<div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color: red"></div></td>

				</tr>
				<tr>
					<td><label for="email">メールアドレス</label></td>
					<td><input type="text" th:field="*{email}">
					<div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color: red"></div></td>
				</tr>
					
				<tr>
					<td><label for="name">お問い合わせ内容</label></td>
					<td><textarea th:field="*{contact}" cols="30" rows="10"></textarea>
					<div th:if="${#fields.hasErrors('contact')}" th:errors="*{contact}" style="color: red"></div></td>
				</tr>

			</table>
		<button type="submit">送信</button>
	</form>
	

</body>
</html>
