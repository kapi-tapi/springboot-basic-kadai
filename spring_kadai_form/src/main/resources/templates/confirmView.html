<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>お問い合わせフォーム</title>
</head>
<body>
	<h2>入力内容をご確認ください</h2>
	<table border="1">
        <thead>
            <tr>
                <th>項目</th>
                <th>入力内容</th>
            </tr>
        </thead>
            <tr>
				<td>名前</td>
				<td th:text="${contactForm.name}"></td>
			</tr>
			<tr>
                <td>メールアドレス</td>
                <td th:text="${contactForm.email}"></td>
            </tr>
            <tr>
                <td>お問い合わせ内容</td>
                <td th:text="${contactForm.contact}"></td>
            </tr>
        </tbody>
    </table>
	

</body>
</html>
